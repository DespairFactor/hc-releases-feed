name: Ingest Issue into Releases

on:
  issues:
    types: [opened]

concurrency:
  group: releases-json-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install "ytmusicapi>=1.8.0"
          fi

      - name: Decode YouTube Music auth credential
        if: env.YTM_AUTH_B64 != ''
        env:
          YTM_AUTH_B64: ${{ secrets.YTM_AUTH_B64 }}
        run: |
          printf '%s' "$YTM_AUTH_B64" | base64 -d > .ytm_auth.json

      - name: Ingest issue into releases.json
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python scripts/ingest_issue.py

      - name: Resolve video IDs and expand tracks for new post
        run: |
          AUTH_ARGS=""
          if [ -f .ytm_auth.json ]; then
            AUTH_ARGS="--auth .ytm_auth.json"
          fi
          if [ -f resolve_ytm_ids.py ]; then
            python resolve_ytm_ids.py --max-lookups 25 --delay 0.6 || true
          fi
          if [ -f scripts/expand_release_tracks.py ]; then
            python scripts/expand_release_tracks.py --post-idx 0 --max-expansions 40 --delay 0.6 $AUTH_ARGS || true
          fi

      - name: Publish playlist for new post
        if: env.YTM_AUTH_B64 != '' && hashFiles('scripts/publish_playlists.py') != ''
        env:
          YTM_AUTH_B64: ${{ secrets.YTM_AUTH_B64 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python scripts/publish_playlists.py --auth .ytm_auth.json --post-idx 0 --limit 1 || true

      - name: Remove temporary auth credential
        if: always()
        run: rm -f .ytm_auth.json

      - name: Rebuild static site
        if: hashFiles('build_site.py') != ''
        run: python build_site.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in releases.json ytmusic_cache.json index.html privacy.html terms.html; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: ingest issue #${{ github.event.issue.number }} and rebuild site [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Ingested into \`releases.json\`, expanded tracks, updated playlist, and rebuilt site."
          gh issue close "$ISSUE_NUMBER"
