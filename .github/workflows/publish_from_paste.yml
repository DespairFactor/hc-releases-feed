name: Publish u/sepdri Releases from Pasted Post

on:
  workflow_dispatch:
    inputs:
      post_title:
        description: 'Roundup title (e.g., "new releases November Pt 3")'
        required: true
        type: string
      post_url:
        description: 'Reddit thread URL (optional)'
        required: false
        type: string
        default: "https://www.reddit.com/user/sepdri/"
      raw_post_text:
        description: "Paste the full roundup post text here"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "releases.json"
      - "resolve_ytm_ids.py"
      - "build_site.py"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install ytmusicapi>=1.8.0
          fi

      - name: Ingest pasted roundup into releases.json
        if: github.event_name == 'workflow_dispatch'
        env:
          POST_TITLE: ${{ inputs.post_title }}
          POST_URL: ${{ inputs.post_url }}
          RAW_POST_TEXT: ${{ inputs.raw_post_text }}
        run: python ingest_pasted_post.py

      - name: Resolve YouTube Music video IDs via ytmusicapi
        run: python resolve_ytm_ids.py --max-lookups 25 --delay 0.6

      - name: Render index.html from releases.json
        run: python build_site.py

      - name: Commit and push ytmusic_cache.json, releases.json, and index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ytmusic_cache.json releases.json index.html
          if git diff --staged --quiet; then
            echo "No changes to ytmusic_cache.json, releases.json, or index.html"
          else
            git commit -m "chore: resolve YTM links and update releases [skip ci]"
            git push
          fi
