name: Audit, Re-Resolve, and Maintain

on:
  workflow_dispatch:
    inputs:
      post_idx:
        description: "Post index (0 = newest) or 'all' across every post"
        required: false
        default: "0"
        type: string
      min_score:
        description: "Minimum candidate match score (default: 3.0)"
        required: false
        default: "3.0"
        type: string
      dry_run:
        description: "Preview match changes without modifying files"
        required: false
        default: false
        type: boolean
      recreate_playlists:
        description: "Force recreate and relink YouTube Music playlists"
        required: false
        default: false
        type: boolean
      playlist_limit:
        description: "Max playlists to recreate (e.g. 'all' or '3')"
        required: false
        default: "all"
        type: string
      rebuild_site:
        description: "Rebuild static site pages via build_site.py"
        required: false
        default: true
        type: boolean

concurrency:
  group: releases-json-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install "ytmusicapi>=1.8.0"
          fi

      - name: Decode YouTube Music auth credential
        if: env.YTM_AUTH_B64 != ''
        env:
          YTM_AUTH_B64: ${{ secrets.YTM_AUTH_B64 }}
        run: |
          printf '%s' "$YTM_AUTH_B64" | base64 -d > .ytm_auth.json

      - name: Audit and re-resolve target post(s)
        run: |
          TARGET_POST="${{ github.event.inputs.post_idx || '0' }}"
          MIN_SCORE="${{ github.event.inputs.min_score || '3.0' }}"
          APPLY_FLAG="--apply"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            APPLY_FLAG="--dry-run"
          fi

          AUTH_ARGS=""
          if [ -f .ytm_auth.json ]; then
            AUTH_ARGS="--auth .ytm_auth.json"
          fi

          python -c '
          import json, subprocess, sys

          target = sys.argv[1].strip().lower()
          min_score = sys.argv[2].strip()
          apply_flag = sys.argv[3]
          auth_args = sys.argv[4:]

          with open("releases.json", encoding="utf-8") as f:
              data = json.load(f)

          posts = data.get("posts", [])
          total = len(posts)
          if total == 0:
              print("No posts found in releases.json")
              sys.exit(0)

          indices = list(range(total)) if target == "all" else [int(target)]
          for idx in indices:
              if idx < -total or idx >= total:
                  print(f"Skipping out-of-range index: {idx}", file=sys.stderr)
                  continue
              norm_idx = idx if idx >= 0 else total + idx
              title = posts[norm_idx].get("post_title", "Untitled")
              print(f"\n=== Auditing Post [{norm_idx}/{total - 1}]: {title} ===")
              cmd = [
                  "python", "scripts/audit_post.py",
                  "--post-idx", str(norm_idx),
                  "--min-score", min_score,
                  apply_flag,
              ] + auth_args
              res = subprocess.run(cmd)
              if res.returncode != 0:
                  print(f"Warning: audit_post.py exited {res.returncode} on post {norm_idx}", file=sys.stderr)
          ' "$TARGET_POST" "$MIN_SCORE" "$APPLY_FLAG" $AUTH_ARGS

      - name: Force recreate and relink playlists
        if: ${{ github.event.inputs.dry_run != true && github.event.inputs.recreate_playlists == true && env.YTM_AUTH_B64 != '' && hashFiles('scripts/publish_playlists.py') != '' }}
        env:
          YTM_AUTH_B64: ${{ secrets.YTM_AUTH_B64 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          RAW_LIMIT="${{ github.event.inputs.playlist_limit || 'all' }}"
          LIMIT_CLEAN=$(printf '%s' "$RAW_LIMIT" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')

          python -c '
          import json
          from pathlib import Path

          p = Path("releases.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          for post in d.get("posts", []):
              post.pop("playlist_id", None)
              post.pop("playlist_url", None)
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          '

          CMD="python scripts/publish_playlists.py --auth .ytm_auth.json --force"
          if [[ "$LIMIT_CLEAN" =~ ^[0-9]+$ ]] && [ "$LIMIT_CLEAN" -gt 0 ]; then
            CMD="$CMD --limit $LIMIT_CLEAN"
          fi
          eval "$CMD"

          python -c '
          import json
          from pathlib import Path
          from ytmusicapi import YTMusic

          p = Path("releases.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          ytm = YTMusic(".ytm_auth.json")
          lib = ytm.get_library_playlists(limit=200) or []

          by_title = {}
          for item in lib:
              if not isinstance(item, dict):
                  continue
              t = str(item.get("title") or "").strip().lower()
              pid = item.get("playlistId") or item.get("browseId")
              if t and pid:
                  by_title.setdefault(t, pid)

          relinked = 0
          for post in d.get("posts", []):
              pt = str(post.get("post_title") or "").strip().lower()
              pid = by_title.get(pt)
              if pid:
                  post["playlist_id"] = pid
                  post["playlist_url"] = f"https://music.youtube.com/playlist?list={pid}"
                  relinked += 1

          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"Relinked {relinked} posts from library.")
          '

      - name: Remove temporary auth credential
        if: always()
        run: rm -f .ytm_auth.json

      - name: Rebuild static site
        if: ${{ github.event.inputs.dry_run != true && github.event.inputs.rebuild_site == true && hashFiles('build_site.py') != '' }}
        run: python build_site.py

      - name: Commit and push changes
        if: ${{ github.event.inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in releases.json ytmusic_cache.json index.html privacy.html terms.html; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: audit/maintain releases and site [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
