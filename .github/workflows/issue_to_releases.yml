name: Ingest Issue into Releases

on:
  issues:
    types: [opened]

concurrency:
  group: releases-json-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install "ytmusicapi>=1.8.0"
          fi

      - name: Decode YouTube Music auth credential
        if: env.YTM_AUTH_B64 != ''
        env:
          YTM_AUTH_B64: ${{ secrets.YTM_AUTH_B64 }}
        run: |
          printf '%s' "$YTM_AUTH_B64" | base64 -d > .ytm_auth.json

      - name: Parse issue body and append to releases.json
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python scripts/ingest_issue.py

      - name: Resolve YouTube Music video IDs via ytmusicapi
        if: hashFiles('resolve_ytm_ids.py') != ''
        run: python resolve_ytm_ids.py --max-lookups 25 --delay 0.6

      - name: Expand release tracks for newly ingested post
        if: hashFiles('scripts/expand_release_tracks.py') != ''
        run: |
          AUTH_ARG=""
          if [ -f .ytm_auth.json ]; then
            AUTH_ARG="--auth .ytm_auth.json"
          fi
          python scripts/expand_release_tracks.py --post-idx 0 --max-expansions 40 --delay 0.6 $AUTH_ARG

      - name: Publish playlist for newly ingested post
        if: env.YTM_AUTH_B64 != '' && hashFiles('scripts/publish_playlists.py') != ''
        env:
          YTM_AUTH_B64: ${{ secrets.YTM_AUTH_B64 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python scripts/publish_playlists.py --auth .ytm_auth.json --post-idx 0 --limit 1

      - name: Remove temporary auth credential
        if: always()
        run: rm -f .ytm_auth.json

      - name: Rebuild site pages from releases.json
        if: hashFiles('build_site.py') != ''
        run: python build_site.py

      - name: Commit and push updated data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          for f in ytmusic_cache.json releases.json index.html privacy.html terms.html; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "chore: ingest issue #${{ github.event.issue.number }} and update site [skip ci]"
            git push
          fi

      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Parsed into \`releases.json\`, expanded tracks, published playlist, and updated site."
          gh issue close "$ISSUE_NUMBER"
