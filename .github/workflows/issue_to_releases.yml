name: Ingest Issue into Releases

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install "ytmusicapi>=1.8.0"
          fi

      - name: Parse issue body and append to releases.json
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python scripts/ingest_issue.py

      - name: Resolve YouTube Music video IDs via ytmusicapi
        if: hashFiles('resolve_ytm_ids.py') != ''
        run: python resolve_ytm_ids.py --max-lookups 25 --delay 0.6

      - name: Rebuild index.html from releases.json
        if: hashFiles('build_site.py') != ''
        run: python build_site.py

      - name: Commit and push updated data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in ytmusic_cache.json releases.json index.html; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "chore: ingest issue #${{ github.event.issue.number }} and update site [skip ci]"
            git push
          fi

      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Parsed and merged into \`releases.json\` and triggered site update."
          gh issue close "$ISSUE_NUMBER"
