- name: Audit and re-resolve all posts
        run: |
          TARGET_POST="${{ github.event.inputs.post_idx || '0' }}"
          MIN_SCORE="${{ github.event.inputs.min_score || '3.0' }}"

          APPLY_FLAG="--apply"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            APPLY_FLAG="--dry-run"
          fi

          AUTH_ARG=""
          if [ -f .ytm_auth.json ]; then
            AUTH_ARG="--auth .ytm_auth.json"
          fi

          python -c '
          import json, subprocess, sys

          target = sys.argv[1].strip().lower()
          min_score = sys.argv[2].strip()
          apply_flag = sys.argv[3]
          auth_args = sys.argv[4:]

          with open("releases.json", encoding="utf-8") as f:
              data = json.load(f)

          posts = data.get("posts", [])
          total = len(posts)

          if total == 0:
              print("No posts found in releases.json")
              sys.exit(0)

          indices = list(range(total)) if target == "all" else [int(target)]

          for idx in indices:
              if idx < -total or idx >= total:
                  print(f"Skipping out-of-range post index: {idx}", file=sys.stderr)
                  continue
              norm_idx = idx if idx >= 0 else total + idx
              title = posts[norm_idx].get("post_title", "Untitled")
              print(f"\n=== Processing Post [{norm_idx}/{total - 1}]: {title} ===")
              cmd = [
                  "python", "scripts/audit_post.py",
                  "--post-idx", str(norm_idx),
                  "--min-score", min_score,
                  apply_flag,
              ] + auth_args
              res = subprocess.run(cmd)
              if res.returncode != 0:
                  print(f"Warning: audit_post.py exited with code {res.returncode} on post {norm_idx}", file=sys.stderr)
          ' "$TARGET_POST" "$MIN_SCORE" "$APPLY_FLAG" $AUTH_ARG
