<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>u/sepdri Hardcore Releases — Parser</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #181b22;
      --surface-alt: #13161c;
      --border: #272c38;
      --text-main: #f0f2f5;
      --text-sub: #9ca3af;
      --accent: #e11d48;
      --badge-bg: #222734;
      --badge-text: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem 1rem 4rem;
      line-height: 1.5;
    }

    .container {
      max-width: 940px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 0.92rem;
    }

    .subtitle a {
      color: var(--accent);
      text-decoration: none;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.15rem;
      margin-bottom: 1.5rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    input[type="text"],
    input[type="search"],
    textarea {
      width: 100%;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.92rem;
      padding: 0.6rem 0.75rem;
      font-family: inherit;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.75rem;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: #232836;
      color: var(--text-main);
      font-size: 0.84rem;
      font-weight: 600;
      padding: 0.5rem 0.85rem;
      border-radius: 5px;
    }

    button:hover {
      border-color: #4b5563;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.danger {
      background: transparent;
      color: #fca5a5;
      border-color: #7f1d1d;
    }

    .stats {
      margin-top: 0.75rem;
      font-size: 0.84rem;
      color: var(--text-sub);
    }

    .post-group {
      margin-bottom: 1.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .post-header {
      padding: 0.9rem 1.15rem;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .post-header h2 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      font-size: 0.83rem;
      color: var(--text-sub);
    }

    .post-meta a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .del-post-btn {
      padding: 0.25rem 0.55rem;
      font-size: 0.75rem;
      background: transparent;
      color: #fca5a5;
      border-color: #7f1d1d;
    }

    .card {
      padding: 0.8rem 1.15rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .card:last-child {
      border-bottom: none;
    }

    .card.hidden {
      display: none;
    }

    .card-info {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .artist {
      font-weight: 600;
      color: #fff;
    }

    .divider {
      color: var(--text-sub);
    }

    .badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.74rem;
      padding: 0.12rem 0.48rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .card-links {
      display: flex;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .btn-link {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      text-decoration: none;
    }

    .btn-ytm {
      background: #ff0000;
      color: #fff;
    }

    .btn-yt {
      background: #27272a;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
    }

    .empty {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      color: var(--text-sub);
    }

    @media (max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .card {
        flex-direction: column;
        align-items: flex-start;
      }
      .card-links {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>r/Hardcore Releases — Parser</h1>
      <p class="subtitle">
        Paste roundup text from <a href="https://www.reddit.com/user/sepdri/" target="_blank" rel="noopener noreferrer">u/sepdri</a> to generate YouTube Music and YouTube links locally in your browser.
      </p>
    </header>

    <section class="panel">
      <div class="grid-2">
        <div>
          <label for="postTitle">Roundup Title</label>
          <input type="text" id="postTitle" placeholder="e.g., new releases November Pt 3" />
        </div>
        <div>
          <label for="postUrl">Reddit Thread URL (optional)</label>
          <input type="text" id="postUrl" placeholder="https://www.reddit.com/user/sepdri/" />
        </div>
      </div>

      <div>
        <label for="rawPaste">Paste Roundup Text</label>
        <textarea id="rawPaste" placeholder="Paste lines like:&#10;Disfear - The Last Nail [Sweden]&#10;Lethal Method - The Method LP [Nashville, TN]&#10;No Retreat - Rise Of The Underdog (Quarter Century Warfare Edition)"></textarea>
      </div>

      <div class="actions">
        <button type="button" id="parseBtn" class="primary">Parse &amp; Add Releases</button>
        <button type="button" id="loadSampleBtn">Load Sample Lines</button>
        <button type="button" id="exportJsonBtn">Download releases.json</button>
        <button type="button" id="clearAllBtn" class="danger">Clear Saved Data</button>
      </div>

      <div class="stats" id="statusBar">0 posts • 0 releases</div>
    </section>

    <section class="panel" style="padding: 0.75rem 1.15rem;">
      <input type="search" id="searchInput" placeholder="Filter parsed releases by artist, title, notes, or roundup..." aria-label="Filter releases" />
    </section>

    <main id="outputContainer"></main>
  </div>

  <script>
    const STORAGE_KEY = "sepdri_hc_parser_v1";

    const DEFAULT_STORE = {
      source_user: "sepdri",
      subreddit: "Hardcore",
      updated_at: new Date().toISOString(),
      posts: []
    };

    function loadStore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STORE);
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.posts)) return structuredClone(DEFAULT_STORE);
        return parsed;
      } catch {
        return structuredClone(DEFAULT_STORE);
      }
    }

    function saveStore(store) {
      store.updated_at = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }

    function parseReleaseText(rawText) {
      if (!rawText || !rawText.trim()) return [];
      const normalized = rawText.replace(/(https?:\/\/\S+)/g, "\n$1\n");
      const lines = normalized.split(/\r?\n/);
      const items = [];
      const seen = new Set();

      const uiNoise = new Set([
        "upvote", "downvote", "go to comments", "share", "locked post",
        "stickied post", "archived post", "open", "sort by:", "best", "top", "new"
      ]);

      for (const rawLine of lines) {
        let line = rawLine.replace(/\s+/g, " ").trim();
        if (!line || /^https?:\/\//i.test(line)) continue;
        if (uiNoise.has(line.toLowerCase())) continue;

        let cleaned = line.replace(/^[-*•\d\.\)\]]+\s*/, "").trim();
        cleaned = cleaned.replace(/\s*https?:\/\/\S+/g, "").trim();
        if (!cleaned) continue;

        const notesList = [];
        for (const match of cleaned.matchAll(/\[([^\]]+)\]|\(([^)]+)\)/g)) {
          const note = (match[1] || match[2] || "").trim();
          if (note && !/^https?:/i.test(note)) {
            notesList.push(note);
          }
        }
        const notes = notesList.join(" | ");

        const candidate = cleaned
          .replace(/\[[^\]]*\]|\([^)]*\)/g, " ")
          .replace(/\s+/g, " ")
          .replace(/^[\s\-–—•*]+|[\s\-–—•*]+$/g, "")
          .trim();

        let parts = candidate.split(/\s+[-–—]+\s+/);
        if (parts.length < 2) {
          parts = candidate.split(/\s*[-–—]\s*/);
        }
        if (parts.length < 2) continue;

        const artist = parts[0].trim();
        const title = parts.slice(1).join(" - ").trim();
        if (!artist || !title || artist.length > 100 || title.length > 180) continue;

        const key = `${artist.toLowerCase()}::${title.toLowerCase()}`;
        if (seen.has(key)) continue;
        seen.add(key);

        items.push({ artist, title, notes });
      }

      return items;
    }

    function buildSearchQuery(artist, title) {
      const cleanTitle = title
        .replace(/\[[^\]]*\]|\([^)]*\)/g, " ")
        .replace(/\b(LP|EP|Demo|Split|Single|Promo|Reissue)\b\.?$/i, "")
        .replace(/\s+/g, " ")
        .replace(/^[\s\-–—:/]+|[\s\-–—:/]+$/g, "")
        .trim();
      const cleanArtist = artist.replace(/\s+/g, " ").trim();
      return `${cleanArtist} ${cleanTitle || title}`.trim();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function render() {
      const store = loadStore();
      const filterTerm = document.getElementById("searchInput").value.trim().toLowerCase();
      const container = document.getElementById("outputContainer");
      const statusBar = document.getElementById("statusBar");

      const totalReleases = store.posts.reduce((sum, p) => sum + (p.releases?.length || 0), 0);
      statusBar.textContent = `${store.posts.length} roundup post(s) • ${totalReleases} tracked release(s)`;

      if (!store.posts.length) {
        container.innerHTML = `<div class="empty">Paste a roundup post above and click <strong>Parse &amp; Add Releases</strong> to generate links.</div>`;
        return;
      }

      const htmlParts = [];
      store.posts.forEach((post, postIdx) => {
        const postTitle = post.post_title || "Untitled Roundup";
        const postUrl = post.post_url || "https://www.reddit.com/user/sepdri/";
        const addedAt = post.added_at || "";

        const cards = [];
        for (const rel of (post.releases || [])) {
          const artist = rel.artist || "";
          const title = rel.title || "";
          const notes = rel.notes || "";
          const blob = `${artist} ${title} ${notes} ${postTitle}`.toLowerCase();
          const isMatch = !filterTerm || blob.includes(filterTerm);

          const query = encodeURIComponent(buildSearchQuery(artist, title));
          const ytmUrl = `https://music.youtube.com/search?q=${query}`;
          const ytUrl = `https://www.youtube.com/results?search_query=${query}`;

          cards.push(`
            <div class="card${isMatch ? "" : " hidden"}">
              <div class="card-info">
                <span class="artist">${escapeHtml(artist)}</span>
                <span class="divider">—</span>
                <span class="title">${escapeHtml(title)}</span>
                ${notes ? `<span class="badge">${escapeHtml(notes)}</span>` : ""}
              </div>
              <div class="card-links">
                <a class="btn-link btn-ytm" href="${ytmUrl}" target="_blank" rel="noopener noreferrer">YouTube Music</a>
                <a class="btn-link btn-yt" href="${ytUrl}" target="_blank" rel="noopener noreferrer">YouTube</a>
              </div>
            </div>
          `);
        }

        const anyVisible = cards.some((c) => !c.includes('class="card hidden"'));
        if (filterTerm && !anyVisible) return;

        htmlParts.push(`
          <section class="post-group">
            <div class="post-header">
              <h2>${escapeHtml(postTitle)}</h2>
              <div class="post-meta">
                <span>${escapeHtml(addedAt)}</span>
                <a href="${escapeHtml(postUrl)}" target="_blank" rel="noopener noreferrer">Reddit ↗</a>
                <button type="button" class="del-post-btn" data-post-index="${postIdx}">Remove</button>
              </div>
            </div>
            <div>${cards.join("")}</div>
          </section>
        `);
      });

      container.innerHTML = htmlParts.length
        ? htmlParts.join("")
        : `<div class="empty">No releases match "<strong>${escapeHtml(filterTerm)}</strong>".</div>`;

      container.querySelectorAll(".del-post-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-post-index"));
          const current = loadStore();
          current.posts.splice(idx, 1);
          saveStore(current);
          render();
        });
      });
    }

    document.getElementById("parseBtn").addEventListener("click", () => {
      const titleInput = document.getElementById("postTitle");
      const urlInput = document.getElementById("postUrl");
      const rawInput = document.getElementById("rawPaste");

      const parsedItems = parseReleaseText(rawInput.value);
      if (!parsedItems.length) {
        alert("No 'Artist - Release' lines were detected in the pasted text.");
        return;
      }

      const postTitle = titleInput.value.trim() || `Roundup (${new Date().toISOString().slice(0, 10)})`;
      const postUrl = urlInput.value.trim() || "https://www.reddit.com/user/sepdri/";

      const store = loadStore();
      let existing = store.posts.find(
        (p) => String(p.post_title || "").trim().toLowerCase() === postTitle.toLowerCase()
      );

      if (!existing) {
        existing = {
          post_title: postTitle,
          post_url: postUrl,
          added_at: new Date().toISOString().slice(0, 10),
          releases: []
        };
        store.posts.unshift(existing);
      }

      const seenKeys = new Set(
        existing.releases.map((r) => `${String(r.artist).toLowerCase()}::${String(r.title).toLowerCase()}`)
      );

      for (const item of parsedItems) {
        const key = `${item.artist.toLowerCase()}::${item.title.toLowerCase()}`;
        if (!seenKeys.has(key)) {
          existing.releases.push(item);
          seenKeys.add(key);
        }
      }

      saveStore(store);
      rawInput.value = "";
      render();
    });

    document.getElementById("loadSampleBtn").addEventListener("click", () => {
      document.getElementById("postTitle").value = "new releases November Pt 3";
      document.getElementById("rawPaste").value = [
        "Disfear - The Last Nail [Sweden]",
        "Lethal Method - The Method LP [Nashville, TN]",
        "Walls Of Jericho - System Error: Humanity LP [Detroit, MI]",
        "Headbussa - Survival Measures LP",
        "No Retreat - Rise Of The Underdog (Quarter Century Warfare Edition)"
      ].join("\n");
    });

    document.getElementById("exportJsonBtn").addEventListener("click", () => {
      const store = loadStore();
      const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "releases.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("clearAllBtn").addEventListener("click", () => {
      if (!confirm("Clear all locally saved posts and releases from this browser?")) return;
      localStorage.removeItem(STORAGE_KEY);
      render();
    });

    document.getElementById("searchInput").addEventListener("input", render);

    render();
  </script>
</body>
</html>
